/* Agenda visual de vehículos: tarjeta diferente de una tarea interna */
.vehicle-actions{display:flex;align-items:center;justify-content:space-between;gap:9px}

/* Twelve-hour analog appointment time picker, isolated from other task forms. */
#app .booking-clock-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
#app .booking-clock-field{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:12px;color:#245039;font-weight:750}
#app .booking-clock-open{display:flex;align-items:center;justify-content:space-between;gap:5px;width:100%;min-height:49px;padding:9px 10px;border:1px solid #accfba;border-radius:10px;background:#fff;color:#145c42;text-align:left;font-size:13px;font-weight:850;line-height:1.3}
#app .booking-clock-open:focus-visible,#app .atm-clock-panel button:focus-visible{outline:3px solid #93cfac;outline-offset:2px}
#app .booking-clock-open svg{width:21px;height:21px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
#app .booking-clock-help{font-size:11px;color:#52725d;line-height:1.4}
#app .atm-clock-layer{position:absolute;inset:0;z-index:210;background:#071b14aa;display:flex;justify-content:center;align-items:center;padding:12px}
#app .atm-clock-panel{display:flex;flex-direction:column;gap:12px;width:min(100%,350px);max-height:calc(100% - 20px);overflow-y:auto;overscroll-behavior:contain;background:#fff;border-radius:20px;padding:17px 16px 16px;box-shadow:0 15px 45px #071e1980}
#app .atm-clock-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#143e2a;font-size:13px;font-weight:800}
#app .atm-clock-heading button{background:transparent;border:0;font-size:24px;line-height:1;color:#42634c;padding:5px}
#app .atm-clock-display{display:flex;justify-content:center;align-items:center;gap:5px}
#app .atm-clock-display .atm-clock-segment{font-size:31px;line-height:1.1;font-weight:900;color:#39765b;background:#e9f3ed;border:0;border-radius:12px;padding:8px 12px;font-variant-numeric:tabular-nums}
#app .atm-clock-display .atm-clock-segment.selected{background:#086d53;color:#fff}
#app .atm-clock-colon{font-size:31px;font-weight:900;color:#145b45}
#app .atm-clock-periods{display:flex;flex-direction:column;gap:5px;margin-left:6px}
#app .atm-clock-periods button{padding:6px 9px;border-radius:7px;border:1px solid #c7ddcf;background:#fff;color:#35684e;font-size:12px;font-weight:800}
#app .atm-clock-periods button.selected{background:#0a6c50;border-color:#0a6c50;color:#fff}
#app .atm-clock-dial{height:264px;width:264px;border-radius:50%;position:relative;margin:0 auto;background:#eef4ee;border:1px solid #d8e7db;flex:none;touch-action:manipulation}
#app .atm-clock-number{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;display:grid;place-items:center;background:transparent;border:0;border-radius:50%;font-size:14px;font-weight:850;color:#345b44;z-index:2;font-variant-numeric:tabular-nums}
#app .atm-clock-number.selected{background:#0b7658;color:#fff}
#app .atm-clock-hand{position:absolute;left:calc(50% - 2px);top:calc(50% - 78px);width:4px;height:78px;background:#0b7658;border-radius:3px;transform-origin:50% 100%;pointer-events:none;z-index:1}
#app .atm-clock-center{position:absolute;left:50%;top:50%;width:10px;height:10px;background:#0b7658;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
#app .atm-clock-steptext{font-size:12px;color:#537462;text-align:center;line-height:1.3}

.booking-instructions{font-size:12px!important;color:#385641!important;-webkit-text-fill-color:#385641!important;font-weight:600;line-height:1.5;margin:6px 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}

const schedule=(id,d)=>[...jobs.filter(j=>j.userId===Number(id)&&j.day===d).map(j=>({kind:'job',key:'j'+j.id,record:j,order:j.order})),...bookedFor(id,d).map(a=>({kind:'booking',key:'b'+a.id,record:a,order:a.order}))].sort((a,b)=>(a.order??9999)-(b.order??9999)||a.key.localeCompare(b.key));
function renumber(id,d){if(id==null||id==='all'||id==='pending')return;schedule(id,d).forEach((item,i)=>item.record.order=i+1)}
function prependBooking(booking){if(booking.userId===null){booking.order=null;return}schedule(booking.userId,booking.day).filter(x=>x.record!==booking).forEach((item,i)=>item.record.order=i+2);booking.order=1}

 return '<'+(adminCanEdit?'button':'div')+' class="booking-card priority-'+esc(a.priority)+(draggable?' task':'')+'" data-work-uuid="'+esc(a.uuid||'')+'"'+(adminCanEdit?' data-a="editbooking" data-booking="'+a.id+'" title="Editar vehículo agendado"':'')+(draggable?' data-work="b'+a.id+'"':'')+'>'+(position!==null?'<span class="numb">'+position+'</span>':'')+'<span class="booking-icon">🚘</span><span class="booking-content"><span class="booking-label">VEHÍCULO AGENDADO</span><strong class="booking-name">'+esc(a.vehicle)+'</strong>'+(unreadCalendar().some(c=>c.work_item_id===a.uuid)?'<span class="atm-new-label">Novedad</span>':'')+'<span class="booking-time'+(a.receptionStart&&a.receptionEnd?'':' unscheduled')+'">🕗 Recepción: '+esc(receptionRange(a))+'</span><p class="booking-instructions">'+esc(a.instructions)+'</p>'+(me?.role==='admin'&&a.serviceType&&a.serviceType!=='Por definir'?'<span class="service-pill">'+esc(a.serviceType==='Otro'?(a.serviceOther||'Otro'):a.serviceType)+'</span>':'')+'<span class="priority-label priority-'+esc(a.priority)+'"><span class="legend-dot '+esc(a.priority)+'"></span>'+esc(pr.name)+'</span>'+(a.userId===null?'<span class="assignment-flag" style="margin-left:5px">Pendiente de asignar</span>':'')+noteInCalendar('booking',a.id)+'</span>'+(draggable?'<span class="atm-task-drag-handle" title="Mantené presionado aquí para ordenar" aria-label="Mantener presionado para reordenar">⋮⋮</span>':adminCanEdit?'<span style="color:#296a4f;font-weight:900">›</span>':'')+'</'+(adminCanEdit?'button':'div')+'>';
}
function workHTML(item,i,adminCanEdit=false,draggable=false){if(item.kind==='booking')return bookingHTML(item.record,adminCanEdit,i+1,draggable);
 const j=item.record;return '<'+(draggable?'button':'div')+' class="item'+(draggable?' task':'')+'" data-work-uuid="'+esc(j.uuid||'')+'" style="border-left:3px solid #91b7a0"'+(draggable?' data-a="editjob" data-job="'+j.id+'" data-work="j'+j.id+'"':'')+'><span class="numb">'+(i+1)+'</span><span class="details"><strong>'+esc(j.title)+'</strong>'+(unreadCalendar().some(c=>c.work_item_id===j.uuid)?'<span class="atm-new-label">Novedad</span>':'')+'<small>'+esc(j.detail)+'</small>'+noteInCalendar('job',j.id)+'</span>'+(draggable?'<span class="atm-task-drag-handle" title="Mantené presionado aquí para ordenar" aria-label="Mantener presionado para reordenar">⋮⋮</span>':'')+'</'+(draggable?'button':'div')+'>';
}
function pendingPanel(d,adminCanEdit=false){const arr=pendingBookings(d);if(!arr.length)return '';

}

 cloud.sb.from('atm_notice_reads').upsert(unread.map(notice_id=>({notice_id,user_id:author})),{onConflict:'notice_id,user_id',ignoreDuplicates:true}).then(({error})=>{
  if(error&&error.code!=='23505'){

let atmClock=null;
function atmClockDismiss(){
 atmClock=null;
 root.querySelector('#atm-clock-root')?.remove();
}
function atmClockOpen(field){
 if(me?.role!=='admin'||!['newbooking','editbooking'].includes(dialog?.type)||!['start','end'].includes(field))return;
 const form=overlay.querySelector('#bookingform'),input=form?.elements.namedItem(field==='start'?'receptionStart':'receptionEnd');
 if(!input)return;
 const raw=/^\d{2}:\d{2}$/.test(input.value)?input.value:(field==='start'?'09:00':'11:00');
 const hour24=Number(raw.slice(0,2));
 atmClock={field,step:'hour',hour:hour24%12||12,minute:Number(raw.slice(3,5)),period:hour24>=12?'PM':'AM'};
 atmClockDraw();
}
function atmClockDraw(){
 if(!atmClock)return;
 let layer=root.querySelector('#atm-clock-root');
 if(!layer){layer=document.createElement('div');layer.id='atm-clock-root';layer.className='atm-clock-layer';root.appendChild(layer)}
 const c=atmClock,isHour=c.step==='hour',selected=isHour?c.hour%12:c.minute;
 const angle=isHour?selected*30:c.minute*6;
 const positions=Array.from({length:12},(_,i)=>{
  const value=isHour?(i||12):i*5;
  const a=i*Math.PI/6;
  const dx=Math.round(Math.sin(a)*105),dy=-Math.round(Math.cos(a)*105);
  const active=isHour?c.hour===value:c.minute===value;
  const label=isHour?String(value):String(value).padStart(2,'0');
  return '<button type="button" data-a="atm-clock-value" data-value="'+value+'" class="atm-clock-number'+(active?' selected':'')+'" style="left:calc(50% + '+dx+'px);top:calc(50% + '+dy+'px)" aria-label="'+(isHour?'Hora ':'Minuto ')+label+'" aria-pressed="'+active+'">'+label+'</button>';
 }).join('');
 const title=c.field==='start'?'Hora de recepción':'Hora de finalización';
 layer.innerHTML='<div class="atm-clock-panel" role="dialog" aria-modal="true" aria-label="'+title+'">'+
  '<div class="atm-clock-heading"><strong>'+title+'</strong><button type="button" data-a="atm-clock-dismiss" aria-label="Cerrar selector">×</button></div>'+
  '<div class="atm-clock-display">'+
   '<button type="button" data-a="atm-clock-segment" data-step="hour" class="atm-clock-segment'+(isHour?' selected':'')+'">'+String(c.hour).padStart(2,'0')+'</button>'+
   '<span class="atm-clock-colon">:</span>'+
   '<button type="button" data-a="atm-clock-segment" data-step="minute" class="atm-clock-segment'+(!isHour?' selected':'')+'">'+String(c.minute).padStart(2,'0')+'</button>'+
   '<div class="atm-clock-periods">'+
    '<button type="button" data-a="atm-clock-period" data-period="AM" class="'+(c.period==='AM'?'selected':'')+'" aria-pressed="'+(c.period==='AM')+'">a. m.</button>'+
    '<button type="button" data-a="atm-clock-period" data-period="PM" class="'+(c.period==='PM'?'selected':'')+'" aria-pressed="'+(c.period==='PM')+'">p. m.</button>'+
   '</div></div>'+
  '<div class="atm-clock-steptext">'+(isHour?'Seleccioná primero la hora':'Ahora seleccioná los minutos')+'</div>'+
  '<div class="atm-clock-dial" aria-label="'+(isHour?'Reloj de horas':'Reloj de minutos')+'">'+
   '<span class="atm-clock-hand" style="transform:rotate('+angle+'deg)"></span>'+
   positions+'<span class="atm-clock-center"></span></div>'+
  (!isHour?'<div class="atm-clock-adjust"><button type="button" data-a="atm-clock-adjust" data-delta="-1" aria-label="Restar un minuto">−</button><span>Ajustar 1 minuto</span><button type="button" data-a="atm-clock-adjust" data-delta="1" aria-label="Sumar un minuto">+</button></div>':'')+
  '<div class="atm-clock-actions"><button type="button" data-a="atm-clock-dismiss">Cancelar</button><button type="button" class="done" data-a="atm-clock-done">Listo</button></div></div>';
}
function atmClockSelect(value){
 if(!atmClock)return;
 if(atmClock.step==='hour'){
  if(!Number.isInteger(value)||value<1||value>12)return;
  atmClock.hour=value;atmClock.step='minute';
 }else{
  if(!Number.isInteger(value)||value<0||value>59)return;
  atmClock.minute=value;
 }
 atmClockDraw();
}
function atmClockCommit(){
 if(!atmClock)return;
 const c=atmClock,form=overlay.querySelector('#bookingform');
 if(!form){atmClockDismiss();return}
 const h=(c.hour%12)+(c.period==='PM'?12:0);
 const value=String(h).padStart(2,'0')+':'+String(c.minute).padStart(2,'0');
 const field=c.field,part=field==='start'?'receptionStart':'receptionEnd',input=form.elements.namedItem(part);
 if(!input)return;
 if(field==='start'&&value>='23:59'){notify('Elegí una hora inicial anterior a las 11:59 p. m.');return}
 if(field==='end'&&value<=String(form.elements.namedItem('receptionStart')?.value||'')){
  notify('La hora de finalización debe ser posterior a la de recepción.');return;
 }
 input.value=value;
 const label=form.querySelector('#atm-clock-label-'+field);
 if(label)label.textContent=receptionHour(value);
 if(field==='start'){
  const end=addReceptionHours(value);
  const endInput=form.elements.namedItem('receptionEnd');
  if(endInput)endInput.value=end;
  const endLabel=form.querySelector('#atm-clock-label-end');
  if(endLabel)endLabel.textContent=receptionHour(end);
  const warning=form.querySelector('#atm-clock-warning');
  if(warning)warning.textContent=end==='23:59'?'El rango termina el mismo día. Podés ajustar la hora final.':'Finalización ajustada automáticamente a dos horas después.';
 }else{
  const warning=form.querySelector('#atm-clock-warning');
  if(warning)warning.textContent='Hora final modificada manualmente.';
 }
 atmClockDismiss();
}
root.addEventListener('click',e=>{
 const action=e.target.closest('[data-a^="atm-clock-"]');
 if(action){
  e.preventDefault();e.stopImmediatePropagation();
  const name=action.dataset.a;
  if(name==='atm-clock-open')atmClockOpen(action.dataset.field);
  else if(name==='atm-clock-dismiss')atmClockDismiss();
  else if(name==='atm-clock-value')atmClockSelect(Number(action.dataset.value));
  else if(name==='atm-clock-segment'&&atmClock){atmClock.step=action.dataset.step;atmClockDraw()}
  else if(name==='atm-clock-period'&&atmClock){atmClock.period=action.dataset.period;atmClockDraw()}
  else if(name==='atm-clock-adjust'&&atmClock){atmClock.minute=Math.max(0,Math.min(59,atmClock.minute+Number(action.dataset.delta)));atmClockDraw()}
  else if(name==='atm-clock-done')atmClockCommit();
  return;
 }
 if(!atmClock)return;
 if(e.target.id==='atm-clock-root'){e.preventDefault();e.stopImmediatePropagation();atmClockDismiss();return}
 const dial=e.target.closest('.atm-clock-dial');
 if(dial&&!e.target.closest('button')){
  e.preventDefault();e.stopImmediatePropagation();
  const r=dial.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  if(Math.hypot(dx,dy)<30)return;
  const degrees=(Math.atan2(dx,-dy)*180/Math.PI+360)%360;
  atmClockSelect(atmClock.step==='hour'?(Math.round(degrees/30)%12||12):Math.round(degrees/6)%60);
 }
},true);
document.addEventListener('keydown',e=>{
 if(atmClock&&e.key==='Escape'){e.preventDefault();e.stopPropagation();atmClockDismiss()}
});

function transfer(move){
 const d=dialog;
 const arr=onDay(d.src,d.scope).map(x=>({...x,kind:'job'}));
 const booked=bookingsDay(d.src,d.scope).map(a=>({...a,kind:'booking'}));
 const groups=new Map();
 for(const item of [...arr,...booked]){const g=item.userId??'pending';if(!groups.has(g))groups.set(g,[]);groups.get(g).push(item)}
 for(const [owner,items] of groups){
  items.sort((a,b)=>(a.order??9999)-(b.order??9999)||a.id-b.id);
  let destOrder=owner==='pending'?null:schedule(owner,d.dest).length;
  for(const item of items){if(destOrder!==null)destOrder++;
   if(item.kind==='job'){
    if(move){const old=jobs.find(x=>x.id===item.id);if(old){old.day=d.dest;old.order=destOrder}}
    else jobs.push({id:nextJob++,userId:item.userId,day:d.dest,title:item.title,detail:item.detail,order:destOrder});
   }else{
    if(move){const old=appointments.find(x=>x.id===item.id);if(old){old.day=d.dest;old.order=destOrder}}
    else appointments.push({id:nextAppointment++,userId:item.userId,day:d.dest,vehicle:item.vehicle,instructions:item.instructions,priority:item.priority,serviceType:item.serviceType||'Por definir',serviceOther:item.serviceOther||'',receptionStart:item.receptionStart||null,receptionEnd:item.receptionEnd||null,order:destOrder});
   }
  }
  if(owner!=='pending'){renumber(owner,d.src);renumber(owner,d.dest)}
 }
 day=d.dest;week=d.dest;closeDialog();render();notify(arr.length+booked.length+(move?' actividades movidas':' actividades copiadas'));
}

function removeStuff(){
 const d=dialog;
 if(d.type==='deleteJob'){
  const j=jobs.find(x=>x.id===d.id);jobs=jobs.filter(x=>x.id!==d.id);if(j)renumber(j.userId,j.day);
 }else{
  const affected=[...new Set([...onDay(d.src,d.scope),...bookingsDay(d.src,d.scope)].map(x=>x.userId).filter(x=>x!=null))];
  jobs=jobs.filter(j=>!(j.day===d.src&&(d.scope==='all'||j.userId===Number(d.scope))));
  appointments=appointments.filter(a=>!(a.day===d.src&&(d.scope==='all'||(d.scope==='pending'?a.userId===null:a.userId===Number(d.scope)))));
  for(const id of affected)renumber(id,d.src);
 }
 closeDialog();render();notify('Programación eliminada');
}

   if(target){const arr=schedule(d.emp,d.day),from=arr.findIndex(x=>x.key===d.key),to=arr.findIndex(x=>x.key===target.dataset.work);

   }
  }
 }

 if(action?.type==='reorder'){render();notify('Orden de atención actualizado')}

root.addEventListener('submit',async e=>{
 if(e.target.id!=='atm-cleanup-confirm')return;
 e.preventDefault();e.stopImmediatePropagation();
 const c=cleanupState;
 if(me?.role!=='admin'||dialog?.type!=='cleanup'||!c?.result?.counts||c.busy)return;
 const fd=new FormData(e.target);
 if(String(fd.get('word')||'').trim()!=='ELIMINAR'||fd.get('accept')!=='on')return;
 const dates={from:c.result.start,to:c.result.end},expected={...c.result.counts};
 c.busy=true;c.error='';
 overlay.innerHTML=modalHTML();
 const wasReady=cloud.ready;
 try{
  if(!cloud.sb||!me?.uuid)throw new Error('No hay sesión activa.');

  if(error||!data?.session?.access_token||data.session.user?.id!==me.uuid)throw new Error('Volvé a iniciar sesión.');
  // Suspend browser writes until the authoritative server operation is complete.
  cloud.ready=false;
  clearTimeout(cloud.writeTimer);
  const result=await cloudAPI({action:'cleanup_delete',date_from:dates.from,date_to:dates.to,expected_counts:expected,confirm:'ELIMINAR'},data.session.access_token);
  if(!result?.ok||result.deleted!==true)throw new Error('Supabase no confirmó el borrado.');
  const own=me.uuid;
  // Clear locally queued copies of records from the removed period on this device.
  const stillPending=atmReadOutbox(own).filter(row=>{
   const created=typeof row.created_at==='string'?
    new Intl.DateTimeFormat('sv-SE',{timeZone:'America/El_Salvador',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(row.created_at)):'';
   const work=String(row.work_day||'').slice(0,10);
   return !([created,work].some(d=>d&&d>=dates.from&&d<=dates.to));
  });
  if(stillPending.length)localStorage.setItem(atmOutboxKey(own),JSON.stringify(stillPending));
  else localStorage.removeItem(atmOutboxKey(own));
  closeDialog();
  await cloudLoad();
  notify('Historial eliminado en Supabase. Registros confirmados: '+Object.values(expected).reduce((n,v)=>n+Number(v||0),0));
 }catch(err){
  c.error=String(err.message||'No se pudo confirmar la eliminación.');
  c.result=null; // Un error obliga a solicitar una vista previa nueva.
  if(me?.role==='admin'&&dialog?.type==='cleanup')overlay.innerHTML=modalHTML();
 }finally{
  if(!cloud.ready)cloud.ready=wasReady;
  c.busy=false;
  if(me?.role==='admin'&&dialog?.type==='cleanup')overlay.innerHTML=modalHTML();
 }
},true);

 else if(mode==='month'){
  c.month=String(f.get('month')||'');from=c.month+'-01';

  to=Number.isFinite(d.getTime())?new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0,12)).toISOString().slice(0,10):'';
  if(c.month===TODAY.slice(0,7))to=dayAdd(TODAY,-1);

 else {c.error='Elegí el tipo de período.';overlay.innerHTML=modalHTML();return}
 c.result=null;c.error='';

 const valid=d=>iso.test(d)&&!Number.isNaN(new Date(d+'T12:00:00Z').getTime())&&new Date(d+'T12:00:00Z').toISOString().slice(0,10)===d;
 if(!valid(from)||!valid(to)||from>to||to>=today||(new Date(to+'T12:00:00Z')-new Date(from+'T12:00:00Z'))/86400000>366){
  c.error='Elegí fechas anteriores a hoy y un período máximo de 367 días.';

  c.busy=false;

async function atmLogAskDelete(mode,ids=[],date=null){
 if(!me||!cloud.sb||!['day','ids'].includes(mode))return;
 const requestIds=mode==='ids'?[...new Set(ids)]:[];
 if(mode==='ids'&&!requestIds.length)return;
 const page={type:'logdelete',mode,ids:requestIds,day:mode==='day'?date:null,
   preview:null,error:'',loading:true};
 showDialog(page);
 await atmLogGetPreview(page);
}
async function atmLogGetPreview(page){
 if(!page||dialog!==page)return;
 page.loading=true;page.error='';page.preview=null;overlay.innerHTML=modalHTML();
 try{
  if(!me?.uuid||!cloud.sb)throw new Error('No hay sesión válida.');
  const {data,error}=await cloud.sb.auth.getSession();
  if(error||!data?.session?.access_token||data.session.user?.id!==me.uuid)throw new Error('Tu sesión expiró. Ingresá nuevamente.');
  const response=await cloudAPI({action:'logs_preview',mode:page.mode,day:page.day,ids:page.ids},data.session.access_token);
  if(!response?.ok||!Array.isArray(response.ids)||response.count!==response.ids.length)throw new Error('Supabase no entregó una vista previa válida.');
  page.preview=response;
 }catch(err){page.error=String(err.message||'No se pudieron revisar los registros.');}
 finally{
  page.loading=false;
  if(dialog===page)overlay.innerHTML=modalHTML();
 }
}
async function atmLogDeleteNow(page){
 if(!page?.preview?.ids?.length||dialog!==page||!me?.uuid||page.loading)return;
 if(!cloud.ready||cloud.busy||cloud.loading||cloud.retryPaused||draftSignature()!==cloud.revision){
  page.error='Esperá a que los mensajes y los trabajos terminen de sincronizarse y volvé a consultar.';
  page.preview=null;overlay.innerHTML=modalHTML();return;
 }
 page.loading=true;page.error='';overlay.innerHTML=modalHTML();
 const userId=me.uuid;
 let deletedSuccessfully=false;
 try{
  const {data,error}=await cloud.sb.auth.getSession();
  if(error||!data?.session?.access_token||data.session.user?.id!==userId)throw new Error('La sesión expiró. Ingresá nuevamente.');
  // Pause background writes: this deletion is authoritative on Supabase.
  cloud.ready=false;clearTimeout(cloud.writeTimer);
  const response=await cloudAPI({
    action:'logs_delete',mode:page.mode,day:page.day,ids:page.ids,
    expected_ids:page.preview.ids,confirm:'ELIMINAR'
  },data.session.access_token);
  if(!response?.ok||response.deleted!==true||
     response.count!==page.preview.count||!Array.isArray(response.ids))
    throw new Error('No se recibió una confirmación completa del borrado.');
  const removed=new Set(response.ids);
  messages=messages.filter(m=>!removed.has(m.uuid));
  for(const id of removed){logSelected.delete(id);cloud.lastNotice.delete(id);atmForgetPending(id,userId)}
  logSelectMode=false;logHoldDay=null;
  reportLogs();
  cloud.revision=draftSignature();
  deletedSuccessfully=true;
  if(dialog===page)closeDialog();
  render();
  notify('Se eliminaron '+response.count+' registro'+(response.count===1?'':'s')+' de Supabase y del chat.');
  await cloudLoad();
 }catch(err){
  page.error=String(err.message||'No se pudo completar la eliminación.');
  page.preview=null; // Recheck required before any retry.
  if(dialog===page)overlay.innerHTML=modalHTML();
 }finally{
  page.loading=false;
  if(!cloud.ready)cloud.ready=true;
  if(dialog===page)overlay.innerHTML=modalHTML();
  if(deletedSuccessfully&&me?.uuid===userId)cloudRefresh();
 }
}

root.addEventListener('click',e=>{
 const btn=e.target.closest('[data-a]');
 if(!btn)return;
 const action=btn.dataset.a;
 if(action==='logdate'&&Date.now()<logIgnoreDayClickUntil){
  e.preventDefault();e.stopImmediatePropagation();return;
 }
 const actions=new Set(['atm-log-day-trash','atm-log-start-select','atm-log-cancel-select',
   'atm-log-select-one','atm-log-select-all','atm-log-delete-selected','atm-log-delete-one',
   'atm-log-retry','atm-log-confirm-delete']);
 if(!actions.has(action)){
  if(['logdate','logprev','lognext','openlogs','logsdate'].includes(action)){logSelected.clear();logHoldDay=null}
  return;
 }
 e.preventDefault();e.stopImmediatePropagation();
 if(action==='atm-log-retry'&&dialog?.type==='logdelete'){atmLogGetPreview(dialog);return;}
 if(action==='atm-log-confirm-delete'&&dialog?.type==='logdelete'){
  if(!btn.disabled&&overlay.querySelector('#atm-log-ack')?.checked)atmLogDeleteNow(dialog);
  return;
 }
 if(action==='atm-log-day-trash'){
  if(btn.dataset.day===logHoldDay&&relevantLogs(logHoldDay).length)atmLogAskDelete('day',[],logHoldDay);
  return;
 }
 if(!me||(tab!=='logs'&&!(dialog?.type==='logs'&&action==='atm-log-delete-one')))return;
 const current=atmLogCurrentVisible();
 if(action==='atm-log-start-select'){logSelectMode=true;logSelected.clear();render();return;}
 if(action==='atm-log-cancel-select'){logSelectMode=false;logSelected.clear();render();return;}
 if(action==='atm-log-select-one'){
  const uuid=btn.dataset.uuid;
  if(!current.some(l=>l.uuid===uuid))return;
  if(logSelected.has(uuid))logSelected.delete(uuid);else logSelected.add(uuid);
  render();return;
 }
 if(action==='atm-log-select-all'){
  const ids=current.map(l=>l.uuid);
  if(ids.length&&ids.every(x=>logSelected.has(x)))ids.forEach(x=>logSelected.delete(x));
  else ids.forEach(x=>logSelected.add(x));
  render();return;
 }
 if(action==='atm-log-delete-selected'){
  // Delete only selected, currently visible persisted records.
  const chosen=current.map(x=>x.uuid).filter(id=>logSelected.has(id));
  if(chosen.length)atmLogAskDelete('ids',chosen);
  return;
 }
 if(action==='atm-log-delete-one'){
  const id=btn.dataset.uuid;
  if(logs.some(l=>l.uuid===id))atmLogAskDelete('ids',[id]);
 }
},true);

   if(m.uuid&&cloud.lastNotice.has(m.uuid))continue;
   if(!m.uuid)m.uuid=crypto.randomUUID();
   const row=rowForMessage(m);
   if(!row.author_id||!row.target_employee_id)throw new Error('Destinatario no identificado.');
   const {error:e}=await cloud.sb.from('atm_notices').insert(row);
   if(e){
    if(e.code==='23514'&&String(e.message||'').includes('historial ya limpiado')){
      atmForgetPending(m.uuid,expectedId);
      messages=messages.filter(x=>x!==m);
      continue;
    }
    if(e.code==='23505'){
     const chk=await cloud.sb.from('atm_notices').select('id').eq('id',m.uuid).maybeSingle();
     if(chk.error||!chk.data)throw e;
    }else throw e;
   }
   cloud.lastNotice.add(m.uuid);atmForgetPending(m.uuid,expectedId);updateSendCheck(m.uuid);
   await atmPushDispatch('notice',m.uuid);
  }
  if(me.role==='admin')for(const old of [...cloud.lastWork.keys()]){
   if(seenIds.has(old))continue;
   const {error:e}=await cloud.sb.from('atm_work_items').delete().eq('id',old);if(e)throw e;cloud.lastWork.delete(old);
  }
  cloud.revision=draftSignature();if(tab==='chat')busyStatus('');else busyStatus('Guardado en Supabase');
  setTimeout(()=>{if(!cloud.busy&&!cloud.retryPaused)busyStatus('')},1800);
 }catch(e){
  console.error('Error de sincronización:',e);atmRememberPending();
  if(e.status===401||e.code==='42501'||e.status===403){
   try{const check=await cloud.sb.auth.getUser();
    if((check.error&&[401,403].includes(Number(check.error.status)))||(check.data?.user&&check.data.user.id!==expectedId)){atmRequireLogin();return;}
   }catch(_){}
  }
  cloud.retryPaused=true;
  busyStatus('Error al sincronizar. Tocá aquí para reintentar.');
  notify('El aviso todavía no se guardó. Revisá la conexión.');
 }finally{cloud.busy=false;}
}

const ATM_PUSH_URL=ATM_URL+'/functions/v1/atm-push';
function atmPushKey(raw){const pad='='.repeat((4-raw.length%4)%4),data=atob((raw+pad).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(data,c=>c.charCodeAt(0))}
async function atmPushCall(action,fields={}){
 if(!cloud.sb||!me?.uuid)throw new Error('Iniciá sesión para utilizar notificaciones.');
 const {data,error:se}=await cloud.sb.auth.getSession();
 if(se||!data?.session?.access_token||data.session.user?.id!==me.uuid)throw new Error('Se necesita una sesión válida para enviar notificaciones.');
 const response=await fetch(ATM_PUSH_URL,{method:'POST',headers:{apikey:ATM_PUBLIC_KEY,'Content-Type':'application/json',Authorization:'Bearer '+data.session.access_token},body:JSON.stringify({action,...fields})});
 const body=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(body.error||'No se pudo enviar la notificación.');
 return body;
}
async function atmPushDispatch(action,id){
 // Web Push exclusivo para mensajes de chat guardados en atm_notices.
 if(action!=='notice')return null;
 try{return await atmPushCall('notice',{notice_id:id})}
 catch(e){console.warn('El mensaje quedó guardado, pero no se pudo confirmar el push:',e.message)}
 return null;
}
async function atmPushRegister(allowNew=false){
 if(!me?.uuid||!cloud.sb)throw new Error('Ingresá con tu cuenta primero.');
 if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)||!window.isSecureContext)throw new Error('Este navegador no permite Web Push en esta página.');
 if(Notification.permission!=='granted')throw new Error('Primero tenés que autorizar las notificaciones en Chrome.');
 const reg=await navigator.serviceWorker.ready;
 let sub=await reg.pushManager.getSubscription();
 const oldOwner=localStorage.getItem('atm_push_owner');
 if(sub&&oldOwner&&oldOwner!==me.uuid){await sub.unsubscribe();sub=null}
 if(!sub&&allowNew)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:atmPushKey(ATM_VAPID_PUBLIC)});
 if(!sub)return false;
 const data=sub.toJSON(),keys=data.keys||{};
 if(!data.endpoint||!keys.p256dh||!keys.auth)throw new Error('El teléfono no entregó las claves necesarias.');
 const {error}=await cloud.sb.from('atm_push_subscriptions').upsert({user_id:me.uuid,endpoint:data.endpoint,p256dh:keys.p256dh,auth_secret:keys.auth,last_seen_at:new Date().toISOString()},{onConflict:'endpoint'});
 if(error)throw error;
 localStorage.setItem('atm_push_owner',me.uuid);
 return true;
}
function atmPushPrompt(){

 notice.style.cssText='position:absolute;bottom:85px;left:12px;right:12px;z-index:95;padding:14px 12px;background:white;border:1px solid #bfd9c8;border-radius:14px;box-shadow:0 6px 20px #0002;color:#163829;font-size:13px;display:flex;gap:8px;align-items:center;';
 notice.innerHTML='<span style="flex:1"><strong>Activar notificaciones</strong><br>Recibí avisos del taller aunque la aplicación esté cerrada.</span><button data-a="atm-push-enable" style="background:#087859;color:white;border:0;border-radius:8px;padding:9px;font-weight:700">Activar</button><button data-a="atm-push-dismiss" style="background:none;border:0;font-size:20px;color:#777" aria-label="Cerrar">×</button>';

async function atmEnablePush(){
 // Call requestPermission immediately from the button gesture, not after any await.
 if(!('Notification' in window)||!('serviceWorker' in navigator)||!('PushManager' in window)||!window.isSecureContext){notify('Chrome o este dispositivo no permite las notificaciones web.');return}
 let permission;
 try{permission=Notification.permission==='default'?await Notification.requestPermission():Notification.permission}catch(e){notify('Chrome no pudo solicitar el permiso.');return}
 localStorage.setItem('atm_push_prompted_'+me?.uuid,'1');root.querySelector('#atm-push-prompt')?.remove();
 if(permission!=='granted'){notify('Notificaciones bloqueadas. Revisá los permisos del sitio en Chrome.');return}
 try{
  await atmPushRegister(true);
  notify('Notificaciones activadas. Recibirás los avisos reales del taller.');
 }catch(e){console.error('Error activando Web Push:',e);notify('No se pudieron activar: '+(e.message||'reintentá'))}
}
async function atmPushOnLogin(){
 if(!me?.uuid)return;
 if('Notification' in window&&Notification.permission==='granted'){
  try{await atmPushRegister(false)}catch(e){console.warn('Actualización de Web Push pendiente',e.message)}
 }else if('Notification' in window&&Notification.permission==='default'){
  atmPushPrompt();
 }
}
async function atmPushOnLogout(){
 try{
  const id=me?.uuid;
  if(!id||!('serviceWorker' in navigator))return;
  const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
  if(sub){
   const endpoint=sub.endpoint;
   await sub.unsubscribe();
   await cloud.sb.from('atm_push_subscriptions').delete().eq('user_id',id).eq('endpoint',endpoint);
  }
  localStorage.removeItem('atm_push_owner');
 }catch(e){console.warn('No se pudo desactivar la suscripción del dispositivo',e.message)}
}

async function cloudLogout(){atmRememberPending();await atmPushOnLogout();clearTimeout(cloud.writeTimer);if(cloud.busy)await new Promise(r=>setTimeout(r,800));cloud.ready=false;if(cloud.realtime)await cloud.sb.removeChannel(cloud.realtime);cloud.realtime=null;await cloud.sb.auth.signOut();me=null;users=[];jobs=[];appointments=[];messages=[];logs=[];dialog=null;tab='calendar';error='';seen={};readBy={};cloud.lastWork=new Map();cloud.lastNotice=new Set();cloud.readNoticeIds=new Set();cloud.readCalendarIds=new Set();calendarChanges=[];cloud.userIds=new Map();cloud.workUiIds=new Map();cloud.noticeUiIds=new Map();busyStatus('');render();}
