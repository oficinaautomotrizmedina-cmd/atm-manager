#app.is-admin .pending-access .pending-vehicle-preview{font-size:12px;font-weight:700;color:#2a563d!important;-webkit-text-fill-color:#2a563d!important;line-height:1.45}
/* ATM Manager v20 — chat del administrador sin avatares redundantes. */
#app.is-admin .chat-name-chip{display:inline-flex;align-items:center;justify-content:center;min-width:91px;max-width:150px;min-height:36px;padding:9px 11px;border-radius:10px;background:#d6eddf;color:#075c42!important;-webkit-text-fill-color:#075c42!important;font-size:13px;font-weight:850;line-height:1.25;text-align:center;overflow-wrap:anywhere;flex-shrink:0}
#app.is-admin .chat-preview{color:#315741!important;-webkit-text-fill-color:#315741!important;font-size:12px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;margin:0}
#app.is-admin .chat-chevron{margin-left:auto;font-size:20px;line-height:1;color:#326c4c;font-weight:800;flex-shrink:0;padding-left:2px}
#app.is-admin .chat-list-button{min-height:68px}

/* Logo realmente circular en el encabezado de IA Chat, sin marco cuadrado. */
#app .chathead .avatar.logoavatar{
  width:46px!important;height:46px!important;min-width:46px!important;
  border-radius:50%!important;overflow:hidden!important;
  clip-path:circle(50% at 50% 50%)!important;
  background:#ffffff!important;padding:0!important;
  border:2px solid #ffffffcf!important;display:block!important;
  flex-shrink:0!important;
}
#app .chathead .avatar.logoavatar img.logo-image{
  display:block!important;width:100%!important;height:100%!important;
  max-width:none!important;object-fit:cover!important;
  object-position:center!important;border-radius:50%!important;
  clip-path:circle(50% at 50% 50%)!important;
  margin:0!important;padding:0!important;
}

/* ATM Manager v28 — Avisos dirigidos, notas desde el vehículo y respuesta opcional */
#app .unread-number,#app .nav-unread{display:inline-grid;place-items:center;min-width:22px;height:22px;background:#c74535;color:#fff;border-radius:12px;font-size:11px;font-weight:900;padding:0 6px;flex-shrink:0}
#app .nav-unread{height:17px;min-width:18px;font-size:9px;margin-top:-3px}
#app .incoming-notice{display:flex;align-items:center;justify-content:space-between;width:100%;border-radius:10px;background:#e6f5eb;border:1px solid #b2d9bc;color:#0b6245;text-align:left;padding:12px;font-weight:800;font-size:12px}

const isAdmin=()=>me?.role==='admin';const allEmployees=()=>staff.filter(u=>u.active&&u.role!=='admin');

function headTitle(title,over=''){return '<div><div class="overline">'+esc(over)+'</div><h2 class="ttl">'+esc(title)+'</h2></div>'}
function toolbar(){return '<div class="atm-toolbar"><button data-action="prev" class="atm-arrow">‹</button>'+dateInput(day)+'<button data-action="next" class="atm-arrow">›</button><button class="atm-iconbtn" data-action="today">Hoy</button></div>'}
function workCard(w){const pr=w.priority||'yellow';return '<div class="booking-card priority-'+esc(pr)+'" data-id="'+w.id+'"><div class="booking-icon">🚘</div><div class="booking-content"><span class="booking-label">'+esc(w.kind==='booking'?'VEHÍCULO AGENDADO':'TAREA')+' · '+esc(displayStatus(w.status))+'</span><strong class="booking-name">'+esc(w.vehicle)+'</strong><p class="booking-instructions">'+esc(w.instructions)+'</p><span class="pill">'+esc(employeeName(w.assigned_to))+'</span><span class="pill">'+esc(w.service_type)+'</span><div class="atm-cardactions">'+(isAdmin()?'<button data-action="editwork" data-id="'+w.id+'">Editar</button><button data-action="note" data-id="'+w.id+'">✉ Nota al técnico</button>':'<button data-action="reportwork" data-id="'+w.id+'">+ Reportar</button>')+'</div></div></div>'}
function calendar(){let items=visibles();return '<section class="page">'+headTitle('Calendario','AGENDA DEL TALLER')+'<div class="row">'+(isAdmin()?'<button class="btn" data-action="newwork">＋ Agendar vehículo</button>':'<span class="sub">'+esc(me.display_name)+'</span>')+'</div>'+toolbar()+(isAdmin()?'<label class="field">Mostrar<select id="filterEmployee"><option value="all">Todos</option><option value="pending">Pendientes de asignar</option>'+allEmployees().map(u=>'<option value="'+u.user_id+'" '+(who===u.user_id?'selected':'')+'>'+esc(u.display_name)+'</option>').join('')+'</select></label>':'')+'<div class="row"><b>'+esc(fmt(day))+'</b><span class="pill">'+items.length+' actividades</span></div><div class="work-queue">'+(items.length?items.map(workCard).join(''):'<div class="atm-empty">No hay trabajos registrados para este día.</div>')+'</div><div class="atm-sync">'+(lastSync?'Sincronizado: '+time(lastSync):'Conectado a Supabase')+'</div></section>'}
function tasks(){const arr=myWorks().filter(w=>!w.assigned_to||w.status!=='completed').sort((a,b)=>a.work_day.localeCompare(b.work_day));return '<section class="page">'+headTitle('Tareas','SEGUIMIENTO DE TRABAJOS')+'<div class="stack">'+(arr.length?arr.map(w=>'<div class="atm-taskrow"><b>'+esc(w.vehicle)+'</b><small>'+esc(w.work_day)+' · '+esc(employeeName(w.assigned_to))+' · '+esc(displayStatus(w.status))+'</small>'+(isAdmin()?'<button data-action="editwork" data-id="'+w.id+'">Editar</button>':'')+'</div>').join(''):'<div class="atm-empty">Sin tareas pendientes.</div>')+'</div></section>'}
function noticesFor(uid){return notices.filter(n=>n.target_employee_id===uid).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))}
function isAnswered(n){return notices.some(x=>x.reply_to===n.id)}
function noticeUI(){if(isAdmin()&&!who)who=allEmployees()[0]?.user_id||null;const target=isAdmin()?who:me.user_id;const data=target?noticesFor(target):[];const name=isAdmin()?employeeName(target):'Administración';return '<section class="atm-noticepage">'+(isAdmin()?'<div class="atm-conversations">'+allEmployees().map(u=>'<button class="'+(who===u.user_id?'selected':'')+'" data-action="pickperson" data-id="'+u.user_id+'">'+esc(u.display_name)+'</button>').join('')+'</div>':'')+'<div class="atm-noticehead">'+(isAdmin()?'Avisos para ':'Reportes a ')+esc(name)+'</div><div id="messages" class="atm-messages">'+(data.length?data.map(n=>{const mine=n.author_id===me.user_id;const canReply=!isAdmin()&&!mine&&n.allow_reply&&!isAnswered(n);return '<div class="atm-bubble '+(mine?'mine':'')+'"><div class="atm-bubblecat">'+esc(n.category)+'</div>'+((n.work_item_id&&getWork(n.work_item_id))?'<small>🚘 '+esc(taskName(getWork(n.work_item_id)))+'</small>':'')+'<p>'+esc(n.body)+'</p><small>'+time(n.created_at)+'</small>'+(canReply?'<button data-action="reply" data-id="'+n.id+'">↩ Responder indicación</button>':'')+'</div>'}).join(''):'<div class="atm-empty">Sin reportes todavía.</div>')+'</div>'+(target?'<div class="atm-compose">'+(category?'<div class="atm-context">'+esc(category)+' <button type="button" data-action="cancelcategory">×</button></div>':'')+(isAdmin()?'<label class="atm-allow"><input type="checkbox" id="allowReply"> Permitir respuesta al empleado</label>':'')+'<form id="sendnotice"><div class="atm-composerow">'+(!isAdmin()?'<button type="button" class="atm-plus" data-action="choosecategory">＋</button>':'')+'<textarea id="noticeText" rows="2" maxlength="10000" placeholder="'+(isAdmin()?'Escribí una indicación...':category?'Describí el reporte...':'Seleccioná + para informar...')+'" '+(!isAdmin()&&!category?'disabled':'')+' required></textarea><button type="submit" class="atm-send" '+(!isAdmin()&&!category?'disabled':'')+'>➤</button></div></form></div>':'')+'</section>'}
function logsUI(){const logs=notices.filter(n=>['Registrar bitácora','Informar avance','Reportar problema'].includes(n.category)).slice().sort((a,b)=>b.created_at.localeCompare(a.created_at));return '<section class="page">'+headTitle('Bitácoras','AVANCES Y PROBLEMAS')+'<div class="stack">'+(logs.length?logs.map(n=>'<div class="atm-taskrow"><b>'+esc(n.category)+'</b><small>'+esc(employeeName(n.author_id))+' · '+new Date(n.created_at).toLocaleDateString('es-SV')+'</small><p>'+esc(n.body)+'</p></div>').join(''):'<div class="atm-empty">Todavía no hay reportes técnicos.</div>')+'</div></section>'}
function usersUI(){if(!isAdmin())return calendar();return '<section class="page">'+headTitle('Usuarios','ADMINISTRACIÓN DE CUENTAS')+'<button class="btn" data-action="newuser" '+(staff.length>=5?'disabled':'')+'>＋ Crear usuario</button><div class="stack">'+staff.map(u=>'<button class="item atm-user" data-action="edituser" data-id="'+u.user_id+'"><strong>'+esc(u.display_name)+'</strong><small>Usuario: '+esc(u.username)+' · '+esc(u.role)+' · '+(u.active?'Activo':'Inactivo')+(u.is_master?' · Master':'')+'</small>›</button>').join('')+'</div><p class="sub">Máximo cinco cuentas. Los cambios se guardan directamente en Supabase.</p></section>'}
function modalUI(){const close='<button class="btn ghost" data-action="closemodal">Cancelar</button>';const yes='<button class="btn" type="submit">Guardar</button>';
 if(form.type==='work'){const w=getWork(form.id);return '<div class="atm-backdrop"><div class="atm-modal"><h3>'+(w?'Editar trabajo':'Agendar vehículo')+'</h3><form id="workform" class="stack"><label class="field">Vehículo o tarea<input name="vehicle" required maxlength="160" value="'+esc(w?.vehicle||'')+'"></label><label class="field">Indicaciones<textarea name="instructions" required maxlength="12000">'+esc(w?.instructions||'')+'</textarea></label><label class="field">Fecha<input name="work_day" type="date" value="'+esc(w?.work_day||day)+'" required></label><label class="field">Tipo<select name="kind"><option value="booking" '+(w?.kind==='booking'||!w?'selected':'')+'>Vehículo agendado</option><option value="job" '+(w?.kind==='job'?'selected':'')+'>Tarea interna</option></select></label><label class="field">Servicio<select name="service_type">'+['Por definir','Revisión','Diagnóstico','Reparación','Mantenimiento','Otro'].map(s=>'<option '+(w?.service_type===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label class="field">Asignar a<select name="assigned_to"><option value="">Pendiente de asignar</option>'+allEmployees().map(u=>'<option value="'+u.user_id+'" '+(w?.assigned_to===u.user_id?'selected':'')+'>'+esc(u.display_name)+'</option>').join('')+'</select></label><label class="field">Nivel<select name="priority">'+[['red','Garantía / Alta'],['yellow','Nivel técnico'],['green','Nivel ingeniería']].map(([s,t])=>'<option value="'+s+'" '+((w?.priority||'yellow')===s?'selected':'')+'>'+t+'</option>').join('')+'</select></label><label class="field">Estado<select name="status">'+[['pending','Pendiente'],['in_progress','En proceso'],['completed','Terminado'],['cancelled','Cancelado']].map(([s,t])=>'<option value="'+s+'" '+((w?.status||'pending')===s?'selected':'')+'>'+t+'</option>').join('')+'</select></label><div class="row">'+close+yes+'</div></form></div></div>'}
 if(form.type==='note'){const w=getWork(form.id);return '<div class="atm-backdrop"><div class="atm-modal"><h3>Nota al técnico</h3><p class="sub">'+esc(w?.vehicle||'')+'</p><form id="noteform" class="stack"><label class="field">Indicación<textarea name="body" maxlength="10000" required></textarea></label><label class="atm-allow"><input type="checkbox" name="allow_reply"> Permitir respuesta</label><div class="row">'+close+yes+'</div></form></div></div>'}
 if(form.type==='category'){const w=works.filter(w=>w.assigned_to===me.user_id);return '<div class="atm-backdrop"><div class="atm-modal"><h3>Tipo de reporte</h3><div class="atm-cats">'+['Informar avance','Reportar problema','Consultas y solicitudes','Registrar bitácora','Asuntos administrativos'].map(c=>'<button data-action="setcategory" data-name="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>'+close+'</div></div>'}
 if(form.type==='workpicker'){const w=works.filter(x=>x.assigned_to===me.user_id&&x.status!=='cancelled');return '<div class="atm-backdrop"><div class="atm-modal"><h3>Seleccionar vehículo</h3><div class="atm-cats">'+w.map(x=>'<button data-action="pickwork" data-id="'+x.id+'">'+esc(x.vehicle)+' <small>'+esc(x.work_day)+'</small></button>').join('')+(w.length?'':'<p class="sub">No tenés vehículos asignados.</p>')+'</div>'+close+'</div></div>'}
 if(form.type==='user'){const u=staff.find(x=>x.user_id===form.id);return '<div class="atm-backdrop"><div class="atm-modal"><h3>'+(u?'Editar cuenta':'Crear cuenta')+'</h3><form id="userform" class="stack"><label class="field">Nombre<input name="display_name" required value="'+esc(u?.display_name||'')+'"></label><label class="field">Usuario<input name="username" pattern="[a-zA-Z0-9_]{2,32}" required value="'+esc(u?.username||'')+'"></label><label class="field">'+(u?'Contraseña nueva (opcional)':'Contraseña (mínimo 10 caracteres)')+'<input name="password" type="password" minlength="'+(u?'0':'10')+'" '+(u?'':'required')+'></label><label class="field">Rol<select name="role">'+[['admin','Administrador'],['supervisor','Supervisor'],['employee','Empleado']].map(([s,t])=>'<option value="'+s+'" '+(u?.role===s?'selected':'')+'>'+t+'</option>').join('')+'</select></label>'+(u?'<label class="atm-allow"><input type="checkbox" name="active" '+(u.active?'checked':'')+' '+(u.is_master?'disabled':'')+'> Cuenta activa</label>':'')+'<div class="row">'+close+yes+'</div></form></div></div>'}
 return '';
}
async function api(body,auth=false){const {data:{session}}=await sb.auth.getSession();const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':PUB,...(auth&&session?{'Authorization':'Bearer '+session.access_token}:{})},body:JSON.stringify(body)});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Fallo del servidor');return j}
async function boot(){container();render();const {data:{session}}=await sb.auth.getSession();if(session)await loadIdentity(session.user.id);}
async function loadIdentity(uid){const {data:p,error}=await sb.from('atm_profiles').select('*').eq('user_id',uid).maybeSingle();if(error||!p?.active){await sb.auth.signOut();me=null;render();message('La cuenta no tiene acceso a ATM Manager.');return;}me=p;await refresh();listen();render();}
async function refresh(silent=false){if(!me)return;const results=await Promise.all([sb.from('atm_profiles').select('*').order('display_name'),sb.from('atm_work_items').select('*').order('work_day',{ascending:false}).limit(750),sb.from('atm_notices').select('*').order('created_at',{ascending:false}).limit(750),sb.from('atm_notice_reads').select('*').limit(750)]);for(const r of results)if(r.error)throw Error(r.error.message);staff=results[0].data;works=results[1].data;notices=results[2].data;reads=results[3].data;lastSync=new Date().toISOString();if(!silent)render()}
let refreshTimer=null;function queueRefresh(){clearTimeout(refreshTimer);refreshTimer=setTimeout(async()=>{try{await refresh();}catch(err){message('Sincronización pendiente: '+err.message)}},500)}
function listen(){if(channel)sb.removeChannel(channel);channel=sb.channel('atm-manager-live-'+me.user_id).on('postgres_changes',{event:'INSERT',schema:'public',table:'atm_notices'},()=>{queueRefresh();message('Nuevo aviso recibido');}).on('postgres_changes',{event:'*',schema:'public',table:'atm_work_items'},queueRefresh).subscribe();}
async function writeNotice({target,cat,body,workId=null,allow=false,reply=null}){const entry={author_id:me.user_id,target_employee_id:target,category:cat,body,allow_reply:allow,work_item_id:workId,reply_to:reply};const {error}=await sb.from('atm_notices').insert(entry);if(error)throw Error(error.message);await refresh();}
async function sendNotice(e){e.preventDefault();const body=$('#noticeText')?.value.trim();if(!body)return;const isA=isAdmin(),target=isA?who:me.user_id;if(!target)return;
 if(!isA&&!category){message('Elegí una categoría.');return}const replyId=category.startsWith('↩')?category.slice(2):null;
 const cat=isA?'Indicación del administrador':replyId?'Respuesta a administración':category;
 await writeNotice({target,cat,body,workId:!isA&&!replyId?formWorkId:null,allow:isA&&!!$('#allowReply')?.checked,reply:replyId||null});category='';formWorkId=null;render();message('Aviso guardado en Supabase.');}
let formWorkId=null;
function takeForm(formNode){const a=Object.fromEntries(new FormData(formNode).entries());return a}
async function saveWork(e){e.preventDefault();const v=takeForm(e.target),id=form.id;const update={vehicle:v.vehicle.trim(),instructions:v.instructions.trim(),kind:v.kind,service_type:v.service_type,priority:v.priority,work_day:v.work_day,assigned_to:v.assigned_to||null,status:v.status,updated_at:new Date().toISOString()};if(!update.vehicle||!update.instructions)throw Error('Completá vehículo e indicaciones.');if(id){const {error}=await sb.from('atm_work_items').update(update).eq('id',id);if(error)throw Error(error.message)}else{update.created_by=me.user_id;update.sort_order=works.filter(w=>w.assigned_to===update.assigned_to&&w.work_day===update.work_day).length+1;const {error}=await sb.from('atm_work_items').insert(update);if(error)throw Error(error.message)}form=null;await refresh();message('Guardado en Supabase.');}
async function saveUser(e){e.preventDefault();const a=takeForm(e.target),old=staff.find(u=>u.user_id===form.id);const data={action:old?'update':'create',username:a.username,display_name:a.display_name,role:a.role,...(old?{user_id:old.user_id,active:old.is_master?true:a.active==='on'}:{password:a.password})};if(old&&a.password)data.password=a.password;await api(data,true);form=null;await refresh();message('Cuenta guardada correctamente.');}
async function saveNote(e){e.preventDefault();const a=takeForm(e.target),work=getWork(form.id);if(!work?.assigned_to)throw Error('Primero asigná un técnico al vehículo.');await writeNotice({target:work.assigned_to,cat:'Indicación del administrador',body:a.body.trim(),workId:work.id,allow:a.allow_reply==='on'});who=work.assigned_to;form=null;tab='notices';render();message('Indicación guardada para el técnico.');}
async function login(e){e.preventDefault();const a=takeForm(e.target),button=e.target.querySelector('button[type=submit]');button.disabled=true;$('#formerror').textContent='Ingresando...';try{const result=await api({action:'login',username:a.username,password:a.password});const {data,error}=await sb.auth.setSession(result);if(error)throw error;await loadIdentity(data.user.id)}catch(err){$('#formerror').textContent=err.message||'No se pudo ingresar.';button.disabled=false}}
async function logOut(){if(channel)sb.removeChannel(channel);await sb.auth.signOut();me=null;staff=[];works=[];notices=[];who=null;tab='calendar';form=null;render();}
root.addEventListener('click',async e=>{const button=e.target.closest('[data-action],[data-tab]');if(!button)return;const id=button.dataset.id,a=button.dataset.action;try{if(button.dataset.tab){tab=button.dataset.tab;category='';formWorkId=null;form=null;render();return}if(a==='logout'){await logOut();return}if(a==='today'){day=localDay();render();return}if(a==='prev'||a==='next'){day=shift(day,a==='prev'?-7:7);render();return}if(a==='users'||a==='logs'){tab=a;form=null;render();return}if(a==='newwork'||a==='editwork'){form={type:'work',id};render();return}if(a==='note'){form={type:'note',id};render();return}if(a==='newuser'||a==='edituser'){form={type:'user',id};render();return}if(a==='closemodal'){form=null;render();return}if(a==='pickperson'){who=id;render();return}if(a==='choosecategory'||a==='reportwork'){formWorkId=a==='reportwork'?id:null;form={type:'category'};tab='notices';render();return}if(a==='setcategory'){category=button.dataset.name;form=null;if(['Informar avance','Reportar problema','Registrar bitácora'].includes(category)&&!formWorkId){form={type:'workpicker'}}render();return}if(a==='pickwork'){formWorkId=id;form=null;render();return}if(a==='cancelcategory'){category='';formWorkId=null;render();return}if(a==='reply'){category='↩'+id;formWorkId=null;form=null;render();$('#noticeText')?.focus();return}}catch(err){message(err.message)}});
root.addEventListener('change',e=>{if(e.target.id==='datevalue'){day=e.target.value;render()}if(e.target.id==='filterEmployee'){who=e.target.value;render()}});
root.addEventListener('submit',e=>{e.preventDefault();const fn={login,workform:saveWork,userform:saveUser,noteform:saveNote,sendnotice:sendNotice}[e.target.id];if(!fn)return;fn(e).catch(err=>{message(err.message);console.error(err)})});
window.addEventListener('online',queueRefresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me)queueRefresh()});
boot().catch(err=>{console.error(err);root.innerHTML='<section class="page"><h2>No pudo iniciarse ATM Manager</h2><p>'+esc(err.message)+'</p><button onclick="location.reload()">Reintentar</button></section>'});
})();
</script><script>if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(console.warn)}</script></body></html>
